[loggers]
keys=root,sampleLogger, new_logger

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=sampleFormatter, notSamplerFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_new_logger]
level=DEBUG
handlers=consoleHandler
qualname=sampleLogger
propagate=0

[logger_sampleLogger]
level=DEBUG
handlers=sampleFormatter
qualname=sampleLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=notSamplerFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=sampleFormatter
args=('example.log',)

[formatter_notSampleFormatter]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S